<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" role="img" aria-label="Vantage">
  <title>Vantage</title>
  <!-- Identity mark — the Vantage orb (components/brand/VantageOrb.tsx).
       Vector twin of the app icon: teal sphere with a specular highlight on
       the dark canvas, glow contained inside the chip. -->
  <defs>
    <radialGradient id="vBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#0e7490" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vRing" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vBody" cx="35%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="12%" stop-color="#bae6fd" stop-opacity="0.90"/>
      <stop offset="28%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.80"/>
      <stop offset="72%" stop-color="#083d5a" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#021428" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="vSpec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0f172a"/>
  <circle cx="50" cy="50" r="46" fill="url(#vBloom)"/>
  <circle cx="50" cy="50" r="43" fill="url(#vRing)"/>
  <circle cx="50" cy="50" r="30" fill="url(#vBody)"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#22d3ee" stroke-opacity="0.60" stroke-width="0.4"/>
  <circle cx="41" cy="41" r="9" fill="url(#vSpec)"/>
</svg>
