name: Execute Pending Orders

on:
  schedule:
    # Every 5 minutes during market hours (Mon-Fri 13:00-21:00 UTC)
    # = 9:00 AM - 5:00 PM ET (includes pre/post-market buffer)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger order execution
        run: |
          echo "⏰ $(date -u +'%Y-%m-%d %H:%M:%S UTC') — Triggering execute-pending-orders"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.GH_CRON_SECRET }}" \
            "https://vantage-ai-trading.vercel.app/api/cron/execute-pending-orders")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Execution failed with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Execution succeeded"
