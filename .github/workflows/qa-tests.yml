name: QA Tests

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 10 * * *'  # nightly (10:00 UTC); adjust for your timezone
  workflow_dispatch: {}

# GITHUB_TOKEN needs write access to file issues + create labels (default is read-only).
permissions:
  contents: read
  issues: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-agent
    env:
      # Target of the live suite — never inferred from source, and deliberately
      # with no hardcoded fallback: the repository variable QA_APP_URL is the
      # single source of truth (Settings → Secrets and variables → Actions →
      # Variables). If it is missing, the guard step below fails the run loudly
      # instead of silently testing whatever host was baked into this file.
      APP_URL: ${{ vars.QA_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve live-suite target
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "::error::APP_URL is empty — the live suite has no target. Define the repository variable QA_APP_URL (Settings → Secrets and variables → Actions → Variables), e.g. https://vantage-ai-trading.vercel.app"
            echo "::error::No hardcoded fallback exists on purpose: a run must never test an implicit host."
            exit 1
          fi
          echo "Live suite target: ${APP_URL}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: run_tests
        continue-on-error: true
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-agent/results/html
          retention-days: 14

      - name: File issues for new failures
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'qa-agent/results/results.json';
            if (!fs.existsSync(path)) return;
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));

            // Collect failed tests, recursing into nested describe() suites.
            // The Playwright JSON reporter nests describe blocks under
            // `suite.suites`, so a flat iteration over `results.suites[].specs`
            // would silently miss every failure.
            const failed = [];
            function collect(suites) {
              for (const suite of suites || []) {
                if (suite.suites) collect(suite.suites);
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const bad = test.results.some(r => r.status !== 'passed');
                    if (bad) failed.push({ title: spec.title, file: suite.file });
                  }
                }
              }
            }
            collect(results.suites);

            if (failed.length === 0) return;

            // Ensure labels exist so issues.create never 422s on a missing label.
            const LABELS = ['qa', 'automated'];
            for (const label of LABELS) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: '0366d6',
                });
              } catch (e) {
                // 422 = already exists; ignore. Other errors surface below.
                if (e.status !== 422) throw e;
              }
            }

            for (const f of failed) {
              const searchTitle = `[QA] ${f.title}`;
              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${searchTitle}"`
              });
              if (existing.data.total_count > 0) continue;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: searchTitle,
                body: `Playwright test failed: ${f.title}\n\nFile: ${f.file}\n\nSee the attached \`playwright-report\` artifact for the HTML report.`,
                labels: LABELS
              });
            }

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
